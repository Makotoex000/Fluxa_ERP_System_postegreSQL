version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend-startup
        - npm install
    build:
      commands:
        - npm run build -- --configuration production
        - echo "--- conteudo do dist ---"
        - ls dist/
        - ls dist/frontend-gestao-marketplace/ || echo "pasta nao encontrada"
  artifacts:
    baseDirectory: frontend-startup/dist/frontend-gestao-marketplace/browser
    files:
      - '**/*'
  cache:
    paths:
      - frontend-startup/node_modules/**/*