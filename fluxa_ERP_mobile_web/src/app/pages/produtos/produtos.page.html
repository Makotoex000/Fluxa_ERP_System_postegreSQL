<div class="app-header">
  <div class="page-title-bar">Lista de Produtos</div>
</div>
<div class="search-bar-wrap">
  <input type="text" class="page-search" [(ngModel)]="busca" (input)="filtrar()" placeholder="Buscar por nome..." />
</div>

<ion-content class="page-content">
  <div class="responsive-container main-content">

    <p *ngIf="!carregando" class="product-counter-cyber">{{ produtosFiltrados.length }} produto(s) encontrado(s)</p>

    <div *ngIf="carregando" class="cards-grid-cyber">
      <div *ngFor="let i of [1,2,3,4]" class="skeleton-card-cyber"></div>
    </div>

    <div *ngIf="!carregando" class="cards-grid-cyber">
      <div *ngFor="let p of produtosFiltrados; trackBy: trackByProductId" class="product-card-cyber">

        <div class="card-top-cyber" style="display:flex;align-items:center;margin-bottom:14px;">
          <div style="width:50px;height:50px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;margin-right:12px;">
            <img *ngIf="p.imageBase64" [src]="p.imageBase64.includes('base64,') ? p.imageBase64 : 'data:image/jpeg;base64,' + p.imageBase64" style="width:100%;height:100%;object-fit:cover;" />
            <svg *ngIf="!p.imageBase64" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:22px;height:22px;color:#8b8ba8;">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9" />
            </svg>
          </div>
          <div style="flex:1;min-width:0;">
            <h3 class="product-name-cyber" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;">{{ p.title }}</h3>
            <span class="product-supplier-cyber" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin-top:2px;">Fornecedor: {{ p.category }}</span>
          </div>
        </div>

        <div class="card-values-grid-cyber">
          <div class="value-block-cyber cost-block-cyber">
            <span class="block-label-cyber">Valor Compra</span>
            <span class="block-price-cyber">{{ moeda(p.purchase_price) }}</span>
          </div>
          <div class="value-block-cyber sale-block-cyber">
            <span class="block-label-cyber">Valor Venda</span>
            <span class="block-price-cyber">{{ moeda(p.sale_price) }}</span>
          </div>
        </div>

        <div class="card-footer-row-cyber">
          <div class="stock-badge-cyber">
            Estoque: <span [style.color]="p.quantity < 10 ? '#f72585' : '#4cc9f0'">{{ p.quantity }} unid.</span>
          </div>
          <div class="margin-badge-cyber">
            <span class="margin-label-cyber">Margem</span>
            <span class="margin-value-cyber">50%</span>
          </div>
        </div>

      </div>
    </div>

    <div *ngIf="!carregando && produtosFiltrados.length === 0" class="empty-state-box-cyber">
      <h4>Nenhum produto encontrado</h4>
    </div>

  </div>
</ion-content>
