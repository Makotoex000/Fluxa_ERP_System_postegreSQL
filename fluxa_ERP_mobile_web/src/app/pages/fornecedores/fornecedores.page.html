<div class="app-header">
  <div class="page-title-bar">Fornecedores</div>
</div>
<div class="search-bar-wrap">
  <input type="text" class="page-search" [(ngModel)]="busca" (input)="filtrar()" placeholder="Buscar por nome..." />
</div>

<ion-content class="page-content">
  <div class="responsive-container main-content-cyber">

    <p *ngIf="!carregando" class="counter-text-cyber">{{ filtrados.length }} fornecedor(es) encontrado(s)</p>

    <div *ngIf="carregando" class="cards-grid-cyber">
      <div *ngFor="let i of [1,2,3,4]" class="skeleton-card-cyber"></div>
    </div>

    <div *ngIf="!carregando" class="cards-grid-cyber">
      <div *ngFor="let f of filtrados" class="supplier-card-cyber">

        <div style="width:46px;height:46px;border-radius:12px;background:rgba(114,9,183,0.15);display:flex;align-items:center;justify-content:center;color:#4cc9f0;font-weight:800;font-size:0.95rem;flex-shrink:0;border:1px solid rgba(114,9,183,0.3);overflow:hidden;">
          <img *ngIf="f.imageBase64" [src]="f.imageBase64.includes('base64,') ? f.imageBase64 : 'data:image/jpeg;base64,' + f.imageBase64" style="width:100%;height:100%;object-fit:cover;" />
          <span *ngIf="!f.imageBase64">{{ iniciais(f.companyName) }}</span>
        </div>

        <div class="supplier-info-cyber">
          <div class="supplier-name-cyber">{{ f.companyName }}</div>
          <div *ngIf="f.contactName" class="supplier-meta-cyber"><span>Contato:</span> {{ f.contactName }}</div>
          <div *ngIf="f.phone" class="supplier-meta-cyber"><span>Tel:</span> <span class="phone-highlight-cyber">{{ f.phone }}</span></div>
        </div>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:18px;height:18px;color:#8b8ba8;flex-shrink:0;">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>

      </div>
    </div>

    <div *ngIf="!carregando && filtrados.length === 0" class="empty-state-cyber">
      <h4>Nenhum fornecedor encontrado</h4>
    </div>

  </div>
</ion-content>
